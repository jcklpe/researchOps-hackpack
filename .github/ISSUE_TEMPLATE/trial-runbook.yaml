    value: GitHub adaptation of the [portable definition](https://github.com/jcklpe/researchOps-hackpack/blob/main/templates/runbooks/trial-runbook.md). Assign an owner and reviewers in your own repository; choose any labels or board conventions your team uses. Documentation links point to the upstream toolkit; use your local versions if you have adapted them. Create related issues in the current repository using Trial Brief and Plan, Recruitment, Data Collection, and Synthesis and Report. Link all four to the project epic.
